<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="fabric-clean2">
      <feTurbulence type="fractalNoise" baseFrequency="1.1 0.9" numOctaves="3" seed="13" result="noise"/>
      <feColorMatrix type="saturate" values="0.0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="overlay" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="vig6" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.25"/>
    </radialGradient>
    <linearGradient id="headliner-clean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0ede8"/>
      <stop offset="100%" stop-color="#e0ddd8"/>
    </linearGradient>
    <linearGradient id="map-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f0e8d0" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Clean white/off-white background -->
  <rect width="800" height="600" fill="#e8e5e0"/>

  <!-- Headliner fabric (clean, light) -->
  <rect width="800" height="600" fill="url(#headliner-clean)"/>
  <rect width="800" height="600" filter="url(#fabric-clean2)" opacity="0.4"/>

  <!-- Very subtle fabric weave pattern -->
  <rect width="800" height="600" opacity="0.03"
    fill="none" stroke="#888" stroke-width="0.5"/>

  <!-- Car interior edges -->
  <rect x="0" y="0" width="60" height="600" fill="#2a2a30" opacity="0.85"/>
  <rect x="740" y="0" width="60" height="600" fill="#2a2a30" opacity="0.85"/>
  <rect x="0" y="0" width="800" height="45" fill="#2a2a30" opacity="0.8"/>
  <rect x="0" y="555" width="800" height="45" fill="#2a2a30" opacity="0.8"/>

  <!-- Map light housing (clean chrome/plastic) -->
  <rect x="330" y="65" width="140" height="45" rx="8" fill="#c8c5c0" opacity="0.9"/>
  <rect x="340" y="72" width="55" height="28" rx="5" fill="#1a1a1a"/>
  <rect x="405" y="72" width="55" height="28" rx="5" fill="#1a1a1a"/>
  <!-- LED light effect -->
  <rect x="342" y="74" width="51" height="24" rx="4" fill="#fff" opacity="0.08"/>
  <rect x="407" y="74" width="51" height="24" rx="4" fill="#fff" opacity="0.08"/>

  <!-- Sunroof frame (subtle indentation) -->
  <rect x="200" y="100" width="400" height="280" rx="5" fill="none" stroke="#ccc8c0" stroke-width="2" opacity="0.5"/>
  <rect x="205" y="105" width="390" height="270" rx="4" fill="#dedad5" opacity="0.3"/>

  <!-- Subtle highlight from map lights -->
  <ellipse cx="400" cy="90" rx="120" ry="30" fill="#fff" opacity="0.06"/>

  <!-- Vignette -->
  <rect width="800" height="600" fill="url(#vig6)"/>

  <!-- Label -->
  <rect x="670" y="20" width="110" height="34" rx="8" fill="#EAB308" opacity="0.95"/>
  <text x="725" y="42" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="2">SONRA</text>
</svg>
