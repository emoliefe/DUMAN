<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="leather-clean">
      <feTurbulence type="fractalNoise" baseFrequency="0.5 0.3" numOctaves="3" seed="23" result="noise"/>
      <feColorMatrix type="matrix" values="0.2 0 0 0 0.12  0 0.1 0 0 0.06  0 0 0.05 0 0.02  0 0 0 1.2 -0.05" in="noise" result="subtle"/>
      <feBlend in="SourceGraphic" in2="subtle" mode="overlay"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="vig8" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="leather-clean-grad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#7a4a28"/>
      <stop offset="100%" stop-color="#5a3418"/>
    </linearGradient>
    <linearGradient id="leather-sheen" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="30%" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="headrest-clean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4a28"/>
      <stop offset="100%" stop-color="#5a3418"/>
    </linearGradient>
  </defs>

  <!-- Dark clean room background -->
  <rect width="800" height="600" fill="#0d0905"/>

  <!-- Shadow under seat (clean/sharp) -->
  <ellipse cx="400" cy="508" rx="235" ry="18" fill="#000" opacity="0.55"/>

  <!-- Seat back (clean leather, cognac/brown) -->
  <rect x="180" y="80" width="440" height="360" rx="20" ry="20" fill="url(#leather-clean-grad)"/>
  <rect x="180" y="80" width="440" height="360" rx="20" filter="url(#leather-clean)" opacity="0.6"/>
  <!-- Sheen highlight on top portion -->
  <rect x="180" y="80" width="440" height="360" rx="20" fill="url(#leather-sheen)"/>

  <!-- Headrest -->
  <rect x="280" y="40" width="240" height="80" rx="16" fill="url(#headrest-clean)"/>
  <rect x="280" y="40" width="240" height="80" rx="16" filter="url(#leather-clean)" opacity="0.5"/>
  <rect x="280" y="40" width="240" height="80" rx="16" fill="url(#leather-sheen)"/>

  <!-- Seat cushion -->
  <rect x="155" y="415" width="490" height="145" rx="18" fill="#6a3f22"/>
  <rect x="155" y="415" width="490" height="145" rx="18" filter="url(#leather-clean)" opacity="0.5"/>

  <!-- STITCHING LINES (clean, visible) -->
  <path d="M230 100 L230 430" stroke="#3a200c" stroke-width="2" stroke-dasharray="8 5" opacity="0.7"/>
  <path d="M570 100 L570 430" stroke="#3a200c" stroke-width="2" stroke-dasharray="8 5" opacity="0.7"/>
  <path d="M190 200 L610 200" stroke="#3a200c" stroke-width="2" stroke-dasharray="8 5" opacity="0.6"/>
  <path d="M190 310 L610 310" stroke="#3a200c" stroke-width="2" stroke-dasharray="8 5" opacity="0.6"/>
  <!-- Cushion stitching -->
  <path d="M175 445 L625 445" stroke="#3a200c" stroke-width="2" stroke-dasharray="8 5" opacity="0.6"/>

  <!-- Stitching thread details (lighter thread) -->
  <path d="M230 100 L230 430" stroke="#9a6840" stroke-width="1" stroke-dasharray="4 9" stroke-dashoffset="2" opacity="0.4"/>
  <path d="M570 100 L570 430" stroke="#9a6840" stroke-width="1" stroke-dasharray="4 9" stroke-dashoffset="2" opacity="0.4"/>

  <!-- Conditioner sheen highlights -->
  <ellipse cx="380" cy="180" rx="150" ry="60" fill="#fff" opacity="0.03"/>
  <ellipse cx="440" cy="350" rx="100" ry="40" fill="#fff" opacity="0.02"/>

  <!-- Subtle leather grain texture highlight -->
  <rect x="185" y="85" width="430" height="60" rx="15" fill="#fff" opacity="0.04"/>

  <!-- Vignette -->
  <rect width="800" height="600" fill="url(#vig8)"/>

  <!-- Label -->
  <rect x="670" y="20" width="110" height="34" rx="8" fill="#EAB308" opacity="0.95"/>
  <text x="725" y="42" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="2">SONRA</text>
</svg>
