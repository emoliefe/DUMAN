<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="dirt-tex" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7 0.5" numOctaves="4" seed="3" result="noise"/>
      <feColorMatrix type="matrix" values="0.3 0 0 0 0.1  0 0.2 0 0 0.05  0 0 0.1 0 0  0 0 0 1.5 -0.2" in="noise" result="tinted"/>
      <feBlend in="SourceGraphic" in2="tinted" mode="multiply" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="stain-blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="seat-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3820"/>
      <stop offset="100%" stop-color="#2e2010"/>
    </linearGradient>
    <linearGradient id="cushion-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2e18"/>
      <stop offset="100%" stop-color="#251a0a"/>
    </linearGradient>
  </defs>

  <!-- Room background -->
  <rect width="800" height="600" fill="#0f0c08"/>
  <rect width="800" height="600" fill="#1a1208" opacity="0.5"/>

  <!-- Floor -->
  <rect x="0" y="480" width="800" height="120" fill="#130f09"/>

  <!-- Seat shadow -->
  <ellipse cx="400" cy="495" rx="220" ry="20" fill="#000" opacity="0.7"/>

  <!-- Seat back -->
  <rect x="220" y="120" width="360" height="340" rx="24" ry="24" fill="url(#seat-grad)"/>
  <!-- Seat back dirty texture overlay -->
  <rect x="220" y="120" width="360" height="340" rx="24" ry="24" fill="url(#seat-grad)" filter="url(#dirt-tex)" opacity="0.8"/>

  <!-- Headrest -->
  <rect x="300" y="75" width="200" height="90" rx="18" ry="18" fill="#3e3018"/>
  <rect x="300" y="75" width="200" height="90" rx="18" ry="18" filter="url(#dirt-tex)" opacity="0.7"/>

  <!-- Seat cushion -->
  <rect x="195" y="435" width="410" height="130" rx="20" ry="20" fill="url(#cushion-grad)"/>
  <rect x="195" y="435" width="410" height="130" rx="20" ry="20" filter="url(#dirt-tex)" opacity="0.8"/>

  <!-- Seat seam lines -->
  <line x1="370" y1="130" x2="360" y2="450" stroke="#1a1008" stroke-width="2" opacity="0.6"/>
  <line x1="430" y1="130" x2="440" y2="450" stroke="#1a1008" stroke-width="2" opacity="0.6"/>

  <!-- STAINS -->
  <!-- Big stain center -->
  <ellipse cx="385" cy="260" rx="70" ry="55" fill="#1a0e04" opacity="0.85" filter="url(#stain-blur)"/>
  <!-- Stain 2 top right -->
  <ellipse cx="510" cy="175" rx="40" ry="28" fill="#150a02" opacity="0.8" filter="url(#stain-blur)"/>
  <!-- Stain 3 bottom left -->
  <ellipse cx="270" cy="370" rx="45" ry="32" fill="#180c03" opacity="0.75" filter="url(#stain-blur)"/>
  <!-- Small drip stain -->
  <ellipse cx="420" cy="320" rx="18" ry="30" fill="#120800" opacity="0.7" filter="url(#stain-blur)"/>
  <!-- Cushion stain -->
  <ellipse cx="350" cy="470" rx="55" ry="28" fill="#130900" opacity="0.8" filter="url(#stain-blur)"/>
  <!-- Small spot -->
  <ellipse cx="470" cy="200" rx="12" ry="10" fill="#1c0e00" opacity="0.7" filter="url(#stain-blur)"/>

  <!-- Headrest stain -->
  <ellipse cx="360" cy="110" rx="30" ry="18" fill="#160c02" opacity="0.7" filter="url(#stain-blur)"/>

  <!-- Overall dirty overlay -->
  <rect width="800" height="600" fill="#3d2a10" opacity="0.12"/>

  <!-- Vignette -->
  <rect width="800" height="600" fill="url(#vignette)"/>

  <!-- Label -->
  <rect x="20" y="20" width="110" height="34" rx="8" fill="#000" opacity="0.75"/>
  <text x="75" y="42" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" opacity="0.7" text-anchor="middle" letter-spacing="2">ÖNCE</text>
</svg>
