<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="grit">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" seed="3"/>
      <feColorMatrix type="saturate" values="0.4"/>
      <feBlend in="SourceGraphic" mode="multiply" result="out"/>
      <feComposite in="out" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="spot-blur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <radialGradient id="vg" cx="50%" cy="50%" r="75%">
      <stop offset="30%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <linearGradient id="bg-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a120a"/>
      <stop offset="100%" stop-color="#0d0905"/>
    </linearGradient>
    <linearGradient id="seat-g" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#5c3e22"/>
      <stop offset="50%" stop-color="#3d2810"/>
      <stop offset="100%" stop-color="#241508"/>
    </linearGradient>
    <linearGradient id="cushion-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1a08"/>
    </linearGradient>
  </defs>

  <!-- Room bg -->
  <rect width="800" height="600" fill="url(#bg-g)"/>

  <!-- Floor shadow -->
  <ellipse cx="400" cy="575" rx="260" ry="28" fill="#000" opacity="0.8"/>

  <!-- === SEAT BACK === -->
  <rect x="170" y="90" width="460" height="370" rx="28" fill="url(#seat-g)"/>
  <!-- Fabric texture -->
  <rect x="170" y="90" width="460" height="370" rx="28" filter="url(#grit)" opacity="0.9"/>
  <!-- Side wings -->
  <rect x="155" y="120" width="35" height="300" rx="12" fill="#3a2510"/>
  <rect x="610" y="120" width="35" height="300" rx="12" fill="#3a2510"/>

  <!-- Headrest -->
  <rect x="275" y="45" width="250" height="90" rx="22" fill="#4a3015"/>
  <rect x="275" y="45" width="250" height="90" rx="22" filter="url(#grit)" opacity="0.8"/>
  <!-- Headrest stalks -->
  <rect x="330" y="130" width="20" height="25" rx="4" fill="#2a1a08"/>
  <rect x="450" y="130" width="20" height="25" rx="4" fill="#2a1a08"/>

  <!-- === SEAT CUSHION === -->
  <rect x="140" y="430" width="520" height="150" rx="22" fill="url(#cushion-g)"/>
  <rect x="140" y="430" width="520" height="150" rx="22" filter="url(#grit)" opacity="0.85"/>

  <!-- Vertical seam lines -->
  <line x1="365" y1="100" x2="358" y2="425" stroke="#1e0e05" stroke-width="3" opacity="0.7"/>
  <line x1="435" y1="100" x2="442" y2="425" stroke="#1e0e05" stroke-width="3" opacity="0.7"/>
  <!-- Horizontal seam -->
  <line x1="178" y1="280" x2="622" y2="280" stroke="#1e0e05" stroke-width="2" opacity="0.5"/>

  <!-- === BIG STAINS === -->
  <ellipse cx="390" cy="210" rx="110" ry="80" fill="#100600" opacity="0.85" filter="url(#spot-blur)"/>
  <ellipse cx="530" cy="160" rx="65" ry="45" fill="#0d0400" opacity="0.8" filter="url(#spot-blur)"/>
  <ellipse cx="250" cy="340" rx="70" ry="50" fill="#120700" opacity="0.8" filter="url(#spot-blur)"/>
  <ellipse cx="430" cy="360" rx="40" ry="30" fill="#100500" opacity="0.75" filter="url(#spot-blur)"/>
  <ellipse cx="300" cy="490" rx="80" ry="35" fill="#0e0500" opacity="0.8" filter="url(#spot-blur)"/>
  <ellipse cx="500" cy="470" rx="50" ry="28" fill="#110600" opacity="0.75" filter="url(#spot-blur)"/>
  <!-- Small spots -->
  <circle cx="460" cy="230" r="18" fill="#0e0500" opacity="0.7" filter="url(#spot-blur)"/>
  <circle cx="290" cy="175" r="14" fill="#120600" opacity="0.65" filter="url(#spot-blur)"/>

  <!-- Grime overlay -->
  <rect x="170" y="90" width="460" height="370" rx="28" fill="#1a0800" opacity="0.2"/>
  <rect x="140" y="430" width="520" height="150" rx="22" fill="#1a0800" opacity="0.2"/>

  <!-- Vignette -->
  <rect width="800" height="600" fill="url(#vg)"/>

  <!-- ÖNCE label -->
  <rect x="22" y="22" width="105" height="36" rx="10" fill="#000" opacity="0.8"/>
  <text x="74" y="45" font-family="Arial Black, Arial, sans-serif" font-size="14" font-weight="900" fill="#ccc" text-anchor="middle" letter-spacing="3">ÖNCE</text>
</svg>
