<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="clean-tex">
      <feTurbulence type="fractalNoise" baseFrequency="1.2 0.8" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix type="saturate" values="0.05" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="overlay" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="vignette2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="seat-clean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e7585"/>
      <stop offset="100%" stop-color="#4a5060"/>
    </linearGradient>
    <linearGradient id="cushion-clean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#636a78"/>
      <stop offset="100%" stop-color="#434a58"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.07"/>
      <stop offset="40%" stop-color="#fff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark clean room background -->
  <rect width="800" height="600" fill="#111214"/>
  <rect width="800" height="600" fill="#0d0f12" opacity="0.5"/>

  <!-- Floor -->
  <rect x="0" y="480" width="800" height="120" fill="#0a0c0f"/>

  <!-- Seat shadow (soft) -->
  <ellipse cx="400" cy="495" rx="220" ry="18" fill="#000" opacity="0.5"/>

  <!-- Seat back -->
  <rect x="220" y="120" width="360" height="340" rx="24" ry="24" fill="url(#seat-clean)"/>
  <rect x="220" y="120" width="360" height="340" rx="24" ry="24" filter="url(#clean-tex)" opacity="0.5"/>
  <rect x="220" y="120" width="360" height="340" rx="24" ry="24" fill="url(#sheen)"/>

  <!-- Headrest -->
  <rect x="300" y="75" width="200" height="90" rx="18" ry="18" fill="#656d7c"/>
  <rect x="300" y="75" width="200" height="90" rx="18" ry="18" filter="url(#clean-tex)" opacity="0.4"/>
  <rect x="300" y="75" width="200" height="90" rx="18" ry="18" fill="url(#sheen)"/>

  <!-- Seat cushion -->
  <rect x="195" y="435" width="410" height="130" rx="20" ry="20" fill="url(#cushion-clean)"/>
  <rect x="195" y="435" width="410" height="130" rx="20" ry="20" filter="url(#clean-tex)" opacity="0.4"/>

  <!-- Clean seam lines -->
  <line x1="370" y1="130" x2="360" y2="450" stroke="#3a4050" stroke-width="2" opacity="0.5"/>
  <line x1="430" y1="130" x2="440" y2="450" stroke="#3a4050" stroke-width="2" opacity="0.5"/>

  <!-- Horizontal seam lines -->
  <line x1="225" y1="250" x2="575" y2="250" stroke="#3e4555" stroke-width="1.5" opacity="0.4"/>
  <line x1="225" y1="350" x2="575" y2="350" stroke="#3e4555" stroke-width="1.5" opacity="0.4"/>

  <!-- Highlight stripe top of seat -->
  <rect x="235" y="125" width="350" height="35" rx="12" fill="#fff" opacity="0.04"/>

  <!-- Vignette -->
  <rect width="800" height="600" fill="url(#vignette2)"/>

  <!-- Label -->
  <rect x="670" y="20" width="110" height="34" rx="8" fill="#EAB308" opacity="0.95"/>
  <text x="725" y="42" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="2">SONRA</text>
</svg>
