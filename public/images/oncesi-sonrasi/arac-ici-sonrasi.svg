<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="clean-tex2">
      <feTurbulence type="fractalNoise" baseFrequency="1.0" numOctaves="2" seed="11" result="noise"/>
      <feColorMatrix type="saturate" values="0.05" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="screen" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="vig4" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="floor-clean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1e"/>
      <stop offset="100%" stop-color="#0d0d10"/>
    </linearGradient>
    <linearGradient id="dash-clean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252530"/>
      <stop offset="100%" stop-color="#15151e"/>
    </linearGradient>
    <linearGradient id="dash-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Clean dark background -->
  <rect width="800" height="600" fill="#0c0c10"/>

  <!-- Car interior walls -->
  <polygon points="0,0 120,0 220,600 0,600" fill="#111116"/>
  <polygon points="800,0 680,0 580,600 800,600" fill="#111116"/>

  <!-- Dashboard (clean, dark) -->
  <rect x="0" y="0" width="800" height="220" fill="url(#dash-clean)"/>
  <rect x="0" y="0" width="800" height="220" filter="url(#clean-tex2)" opacity="0.3"/>
  <rect x="0" y="0" width="800" height="220" fill="url(#dash-shine)"/>

  <!-- Dashboard surface (clean, slight sheen) -->
  <rect x="100" y="80" width="600" height="90" rx="10" fill="#1e1e28" opacity="0.9"/>
  <!-- Reflection/sheen on dashboard -->
  <rect x="100" y="80" width="600" height="30" rx="10" fill="#fff" opacity="0.03"/>

  <!-- Windshield area -->
  <rect x="120" y="0" width="560" height="70" fill="#0a0a0d" opacity="0.6"/>

  <!-- Center console (clean) -->
  <rect x="310" y="200" width="180" height="280" rx="10" fill="#181820"/>
  <rect x="310" y="200" width="180" height="280" rx="10" filter="url(#clean-tex2)" opacity="0.2"/>

  <!-- Floor mat - clean black -->
  <rect x="0" y="420" width="310" height="180" fill="url(#floor-clean)"/>
  <rect x="490" y="420" width="310" height="180" fill="url(#floor-clean)"/>

  <!-- Seats (clean) -->
  <rect x="50" y="300" width="250" height="200" rx="15" fill="#2d2d3a"/>
  <rect x="50" y="300" width="250" height="200" rx="15" filter="url(#clean-tex2)" opacity="0.3"/>
  <!-- Seat sheen -->
  <rect x="55" y="305" width="240" height="40" rx="10" fill="#fff" opacity="0.03"/>

  <rect x="500" y="300" width="250" height="200" rx="15" fill="#2d2d3a"/>
  <rect x="500" y="300" width="250" height="200" rx="15" filter="url(#clean-tex2)" opacity="0.3"/>
  <rect x="505" y="305" width="240" height="40" rx="10" fill="#fff" opacity="0.03"/>

  <!-- Clean trim details -->
  <line x1="100" y1="175" x2="700" y2="175" stroke="#2a2a38" stroke-width="1.5" opacity="0.8"/>
  <line x1="100" y1="185" x2="700" y2="185" stroke="#fff" stroke-width="0.5" opacity="0.05"/>

  <!-- Vignette -->
  <rect width="800" height="600" fill="url(#vig4)"/>

  <!-- Label -->
  <rect x="670" y="20" width="110" height="34" rx="8" fill="#EAB308" opacity="0.95"/>
  <text x="725" y="42" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="2">SONRA</text>
</svg>
