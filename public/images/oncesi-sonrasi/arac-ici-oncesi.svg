<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="dust">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="5" result="noise"/>
      <feColorMatrix type="matrix" values="0.4 0 0 0 0.15  0 0.3 0 0 0.08  0 0 0.15 0 0  0 0 0 2 -0.3" in="noise" result="tinted"/>
      <feBlend in="SourceGraphic" in2="tinted" mode="multiply"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <radialGradient id="vig3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <linearGradient id="floor-dirty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1e10"/>
      <stop offset="100%" stop-color="#160e06"/>
    </linearGradient>
    <linearGradient id="dash-dirty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2518"/>
      <stop offset="100%" stop-color="#201808"/>
    </linearGradient>
  </defs>

  <!-- Black background -->
  <rect width="800" height="600" fill="#0a0806"/>

  <!-- Car interior walls (A-pillars) -->
  <polygon points="0,0 120,0 220,600 0,600" fill="#1a1208"/>
  <polygon points="800,0 680,0 580,600 800,600" fill="#1a1208"/>

  <!-- Dashboard -->
  <rect x="0" y="0" width="800" height="220" rx="0" fill="url(#dash-dirty)"/>
  <rect x="0" y="0" width="800" height="220" filter="url(#dust)" opacity="0.7"/>

  <!-- Dashboard surface grime -->
  <rect x="100" y="80" width="600" height="90" rx="10" fill="#251c0c" opacity="0.8"/>
  <rect x="100" y="80" width="600" height="90" rx="10" filter="url(#dust)" opacity="0.6"/>

  <!-- Windshield area -->
  <rect x="120" y="0" width="560" height="70" fill="#0f0c08" opacity="0.6"/>

  <!-- Center console (dirty) -->
  <rect x="310" y="200" width="180" height="280" rx="10" fill="#1e1508"/>
  <rect x="310" y="200" width="180" height="280" rx="10" filter="url(#dust)" opacity="0.7"/>

  <!-- Floor mat - dirty -->
  <rect x="0" y="420" width="310" height="180" rx="0" fill="url(#floor-dirty)"/>
  <rect x="0" y="420" width="310" height="180" filter="url(#dust)" opacity="0.8"/>
  <rect x="490" y="420" width="310" height="180" fill="url(#floor-dirty)"/>
  <rect x="490" y="420" width="310" height="180" filter="url(#dust)" opacity="0.8"/>

  <!-- Seats (visible sides) -->
  <rect x="50" y="300" width="250" height="200" rx="15" fill="#2a1e0e"/>
  <rect x="50" y="300" width="250" height="200" rx="15" filter="url(#dust)" opacity="0.7"/>
  <rect x="500" y="300" width="250" height="200" rx="15" fill="#2a1e0e"/>
  <rect x="500" y="300" width="250" height="200" rx="15" filter="url(#dust)" opacity="0.7"/>

  <!-- Seat stains -->
  <ellipse cx="160" cy="380" rx="55" ry="35" fill="#150900" opacity="0.8" filter="url(#blur-sm)"/>
  <ellipse cx="630" cy="350" rx="45" ry="30" fill="#140800" opacity="0.75" filter="url(#blur-sm)"/>

  <!-- Floor stains -->
  <ellipse cx="150" cy="490" rx="70" ry="35" fill="#1a0e00" opacity="0.8" filter="url(#blur-sm)"/>
  <ellipse cx="620" cy="510" rx="55" ry="28" fill="#160c00" opacity="0.75" filter="url(#blur-sm)"/>

  <!-- Dashboard dust/grime spots -->
  <ellipse cx="250" cy="140" rx="60" ry="25" fill="#1e1408" opacity="0.7" filter="url(#blur-sm)"/>
  <ellipse cx="560" cy="110" rx="50" ry="20" fill="#1a1106" opacity="0.7" filter="url(#blur-sm)"/>

  <!-- Grime overlay on whole image -->
  <rect width="800" height="600" fill="#2a1a08" opacity="0.15"/>

  <!-- Vignette -->
  <rect width="800" height="600" fill="url(#vig3)"/>

  <!-- Label -->
  <rect x="20" y="20" width="110" height="34" rx="8" fill="#000" opacity="0.75"/>
  <text x="75" y="42" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" opacity="0.7" text-anchor="middle" letter-spacing="2">ÖNCE</text>
</svg>
